<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ULC x LifeForce Mobile Prototype</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      :root {
        --ink: #171717;
        --muted: #6d6a66;
        --soft: #8a8782;
        --line: #dedbd5;
        --surface: #ffffff;
        --wash: #f5f3ee;
        --wash-2: #faf9f5;
        --cta: #fff852;
        --cta-soft: #fff6b8;
        --green: #4d8f45;
        --green-soft: #e9f4e7;
        --gold: #c8941e;
        --gold-soft: #fff7dc;
        --red: #d76732;
        --red-soft: #fff1e9;
        --brown: #111111;
        --shadow: 0 22px 60px rgba(0, 0, 0, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(255, 248, 82, 0.18), transparent 30rem),
          linear-gradient(135deg, #f4f2ed 0%, #e9e6df 100%);
        color: var(--ink);
        font-family:
          "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
      }

      button {
        font: inherit;
      }

      .page {
        padding: 34px 28px 60px;
      }

      .hero {
        max-width: 1440px;
        margin: 0 auto 22px;
      }

      .board-header {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 22px;
        flex-wrap: wrap;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .board-title {
        margin: 0;
        font-size: clamp(40px, 5.4vw, 76px);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 4vw, 62px);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .hero-copy {
        max-width: 820px;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.45;
      }

      .canvas {
        display: grid;
        grid-template-columns: repeat(4, minmax(315px, 1fr));
        gap: 22px;
        max-width: 1600px;
        margin: 0 auto;
        align-items: start;
      }

      .canvas.three-up {
        grid-template-columns: repeat(3, minmax(315px, 1fr));
        margin-top: 28px;
      }

      .interactive-preview {
        display: grid;
        grid-template-columns: minmax(315px, 390px) minmax(300px, 560px);
        gap: 38px;
        align-items: start;
        max-width: 1040px;
        margin: 0 auto 42px;
      }

      .toolbar {
        display: grid;
        gap: 16px;
        padding: 22px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 22px;
        background: var(--brown);
        color: #fff;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.18);
      }

      #livePreview {
        padding-top: 0;
      }

      #livePreview .variant-label {
        display: none;
      }

      .toolbar-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 2px;
      }

      .toolbar h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: -0.02em;
      }

      .toolbar-note {
        color: rgba(255, 255, 255, 0.62);
        font-size: 12px;
        font-weight: 750;
      }

      .control-group {
        display: grid;
        gap: 9px;
        padding-top: 0;
      }

      .control-group + .control-group {
        margin-top: 2px;
      }

      .control-label {
        color: rgba(255, 255, 255, 0.62);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .segmented {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
        gap: 9px;
      }

      .segmented button {
        min-height: 34px;
        padding: 0 11px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.78);
        cursor: pointer;
        font-size: 10.5px;
        font-weight: 800;
        text-align: center;
      }

      .segmented button[aria-pressed="true"] {
        border-color: #fff;
        background: #fff;
        color: var(--brown);
      }

      .at-glance-label {
        max-width: 1600px;
        margin: 0 auto 14px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .view-toggle {
        display: inline-flex;
        gap: 4px;
        padding: 5px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        background: var(--brown);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.16);
      }

      .view-toggle button {
        min-height: 34px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.64);
        cursor: pointer;
        font-size: 13px;
        font-weight: 850;
      }

      .view-toggle button[aria-pressed="true"] {
        background: #fff;
        color: var(--brown);
      }

      .view-panel[hidden] {
        display: none;
      }

      .view-panel {
        padding-top: 28px;
      }

      #allScreensView {
        min-height: 900px;
      }

      .variant {
        display: grid;
        gap: 12px;
      }

      .variant-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 34px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .phone {
        position: relative;
        width: 100%;
        max-width: 390px;
        min-height: 844px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid #d6d1ca;
        border-radius: 34px;
        background: var(--wash-2);
        box-shadow: var(--shadow);
      }

      .phone::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: inherit;
        box-shadow: inset 0 0 0 10px rgba(255, 255, 255, 0.52);
      }

      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 26px 28px 18px;
        font-size: 15px;
        font-weight: 800;
      }

      .status-icons {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .screen {
        height: 750px;
        overflow: auto;
        padding: 0 22px 104px;
        scrollbar-width: none;
      }

      .screen-titlebar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
      }

      .screen::-webkit-scrollbar {
        display: none;
      }

      .header {
        margin-bottom: 20px;
      }

      .header-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .title {
        margin: 0;
        font-size: 27px;
        line-height: 1.08;
        letter-spacing: -0.045em;
      }

      .subtitle {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.32;
      }

      .member-chip,
      .power-chip,
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 999px;
        white-space: nowrap;
        font-size: 11px;
        font-weight: 850;
        letter-spacing: 0.04em;
      }

      .member-chip {
        padding: 8px 11px;
        background: var(--green-soft);
        color: #477b40;
      }

      .power-chip {
        margin-top: 8px;
        padding: 6px 9px;
        background: var(--brown);
        color: #fff;
        text-transform: uppercase;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 1px 0 rgba(28, 25, 22, 0.03);
      }

      .module {
        padding: 18px;
        margin-bottom: 14px;
      }

      .compact {
        padding: 16px;
      }

      .module-title {
        margin: 0;
        font-size: 17px;
        line-height: 1.2;
        letter-spacing: -0.025em;
      }

      .module-copy {
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.43;
      }

      .context {
        background: linear-gradient(180deg, #ffffff, #fffef8);
      }

      .process {
        display: grid;
        grid-template-columns: 1fr auto 1fr auto 1fr;
        align-items: center;
        gap: 7px;
        margin-top: 15px;
      }

      .step {
        min-width: 0;
        padding: 10px 7px;
        border-radius: 13px;
        background: #f4f2ed;
        text-align: center;
        color: var(--brown);
        font-size: 12px;
        font-weight: 800;
      }

      .step small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
        line-height: 1.1;
      }

      .compact .process {
        margin-top: 12px;
      }

      .compact .step {
        padding: 8px 4px;
        font-size: 11px;
      }

      .arrow {
        color: var(--soft);
      }

      .action {
        background: var(--surface);
      }

      .early-context,
      .early-action,
      .early-unlocks,
      .early-products,
      .early-membership {
        margin-bottom: 12px;
      }

      .early-context.module,
      .early-action.module,
      .early-membership.module {
        padding: 16px;
      }

      .early-unlocks {
        padding: 16px;
      }

      .unlock-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
        margin-top: 12px;
      }

      .unlock-item {
        min-height: 78px;
        padding: 11px;
        border-radius: 14px;
        background: #f5f3ee;
      }

      .unlock-item .icon-bubble {
        width: 30px;
        height: 30px;
        margin-bottom: 8px;
        border-radius: 10px;
      }

      .unlock-caption {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.3;
      }

      .cta {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: 100%;
        min-height: 52px;
        margin-top: 16px;
        border: 0;
        border-radius: 16px;
        background: var(--cta);
        color: #050505;
        font-size: 15px;
        font-weight: 850;
        box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.08);
      }

      .cta.dark {
        background: var(--brown);
        color: #fff;
      }

      .cta.ghost {
        border: 1px solid #d3c6a1;
        background: #fffdf0;
        color: var(--brown);
      }

      .row-card {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 13px;
        align-items: center;
        padding: 16px;
        margin-bottom: 12px;
      }

      .icon-bubble {
        display: grid;
        place-items: center;
        width: 43px;
        height: 43px;
        border-radius: 14px;
        background: var(--gold-soft);
        color: var(--gold);
        flex: none;
      }

      .icon-bubble.green {
        background: var(--green-soft);
        color: var(--green);
      }

      .row-title {
        margin: 0;
        font-size: 15px;
        line-height: 1.15;
        font-weight: 850;
      }

      .row-copy {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.25;
      }

      .product-card {
        padding: 17px;
        margin-bottom: 12px;
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .link {
        flex: none;
        color: #aa7b11;
        font-size: 12px;
        font-weight: 800;
      }

      .products {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .product {
        min-width: 0;
      }

      .product-art {
        display: grid;
        place-items: center;
        height: 74px;
        border-radius: 12px;
        background:
          radial-gradient(circle at 70% 20%, rgba(255, 248, 82, 0.28), transparent 34px),
          #f0eee9;
        color: var(--gold);
      }

      .product-name {
        margin: 9px 0 0;
        font-size: 12px;
        font-weight: 850;
        line-height: 1.15;
      }

      .price {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }

      .membership {
        border-color: #eadb9c;
        background: #fffdf0;
      }

      .membership.dark {
        padding: 19px;
        background: var(--brown);
        color: #fff;
      }

      .membership.dark .module-copy,
      .membership.dark .eyebrow-small {
        color: rgba(255, 255, 255, 0.72);
      }

      .membership-status {
        border-color: #cfe8ca;
        background: #f3fbf1;
      }

      .lab-card {
        padding: 17px;
        margin-bottom: 12px;
      }

      .lab-head {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 14px 0;
      }

      .metric {
        padding: 12px 6px;
        border-radius: 12px;
        background: #f2f0eb;
        text-align: center;
      }

      .metric strong {
        display: block;
        font-size: 23px;
        line-height: 1;
      }

      .metric span {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        background: #f1efea;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .chip.active {
        background: var(--brown);
        color: #fff;
      }

      .chip.green {
        background: var(--green-soft);
        color: var(--green);
      }

      .chip.gold {
        background: #fff0cf;
        color: #b27d0c;
      }

      .chip.red {
        background: #ffe8e2;
        color: #c24c35;
      }

      .optimal strong {
        color: var(--green);
      }

      .monitor strong {
        color: var(--gold);
      }

      .attention strong {
        color: #b84f36;
      }

      .note {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 13px;
        margin-bottom: 14px;
        border: 1px solid #ecd7a5;
        border-radius: 13px;
        background: #fff8ea;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.28;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 16px 0 9px;
        font-size: 17px;
        font-weight: 850;
        letter-spacing: -0.02em;
      }

      .insight {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 12px;
        align-items: center;
        padding: 13px;
        margin-bottom: 9px;
      }

      .history {
        padding: 17px;
        margin-bottom: 14px;
      }

      .history-row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 12px 0;
        border-top: 1px solid #ece8e2;
      }

      .history-row:first-of-type {
        border-top: 0;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--green);
      }

      .dot.gray {
        background: #92908b;
      }

      .status-pill {
        padding: 7px 9px;
        background: var(--green-soft);
        color: var(--green);
        letter-spacing: 0;
      }

      .status-pill.gray {
        background: #f1efea;
        color: var(--muted);
      }

      .recommendation {
        padding: 17px;
        margin-bottom: 12px;
      }

      .rec-row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 11px;
        align-items: center;
        padding: 12px 0;
        border-top: 1px solid #ece8e2;
      }

      .rec-row:first-of-type {
        border-top: 0;
      }

      .utility-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 12px;
      }

      .utility-card {
        padding: 14px;
      }

      .utility-card .icon-bubble {
        width: 38px;
        height: 38px;
        margin-bottom: 12px;
      }

      .report-list-card {
        padding: 17px;
        margin-bottom: 12px;
      }

      .report-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .review-status {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #ece8e2;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .empty-state {
        display: grid;
        place-items: center;
        min-height: 420px;
        padding: 24px 16px;
        text-align: center;
      }

      .empty-state .icon-bubble {
        width: 62px;
        height: 62px;
        margin-bottom: 16px;
      }

      .note-preview {
        max-height: 118px;
        overflow: hidden;
        position: relative;
      }

      .note-preview::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 42px;
        background: linear-gradient(transparent, #fff);
      }

      .filter-bar {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        margin: 0 -22px 14px;
        padding: 0 22px 4px;
        scrollbar-width: none;
      }

      .filter-bar::-webkit-scrollbar {
        display: none;
      }

      .bio-section {
        margin-bottom: 16px;
      }

      .bio-row {
        padding: 14px;
        margin-bottom: 9px;
      }

      .bio-row-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: start;
      }

      .range {
        position: relative;
        display: grid;
        grid-template-columns: 28% 42% 30%;
        height: 8px;
        margin-top: 12px;
        overflow: visible;
        border-radius: 999px;
        background: #ebe8e2;
      }

      .range span {
        display: block;
        height: 8px;
      }

      .range .r-red {
        background: #f4c2b7;
      }

      .range .r-green {
        background: #63b36a;
      }

      .range .r-gold {
        background: #e9b14b;
      }

      .marker {
        position: absolute;
        top: -4px;
        left: var(--pos, 50%);
        width: 16px;
        height: 16px;
        border: 3px solid #fff;
        border-radius: 999px;
        background: var(--marker, var(--green));
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.18);
      }

      .hero-value {
        padding: 22px;
        text-align: center;
      }

      .hero-value strong {
        display: block;
        font-size: 58px;
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      .hero-value span {
        color: var(--muted);
        font-size: 15px;
      }

      .product-grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .shop-card {
        overflow: hidden;
      }

      .shop-art {
        display: grid;
        place-items: center;
        height: 118px;
        background:
          radial-gradient(circle at 35% 30%, rgba(255, 248, 82, 0.4), transparent 40px),
          linear-gradient(145deg, #dfe6df, #f4f2ed);
        color: var(--brown);
      }

      .shop-body {
        padding: 12px;
      }

      .profile-banner {
        padding: 16px;
        margin-bottom: 12px;
      }

      .banner-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .progress-track {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #d8ead8;
      }

      .progress-fill {
        height: 100%;
        width: 42%;
        border-radius: inherit;
        background: var(--green);
      }

      .profile-banner.not_started {
        background: #fff9ed;
      }

      .profile-banner.in_progress,
      .profile-banner.complete {
        background: #edf7f0;
      }

      .profile-banner.update_required {
        background: var(--red-soft);
      }

      .profile-banner.update_recommended {
        background: #fffae9;
      }

      .profile-banner.primary-profile {
        background: #fffdf2;
      }

      .profile-banner.quiet-profile {
        padding: 14px;
        background: #f7faf6;
      }

      .profile-banner.quiet-profile .banner-top {
        margin-bottom: 8px;
      }

      .profile-banner.quiet-profile .module-copy {
        margin-bottom: 0;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.08);
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .tag.green {
        background: #d8ecdc;
        color: #3f7f49;
      }

      .tag.orange {
        background: #ffe0cf;

      }

        background: #fff0bd;
        color: #9b7411;
      }

      .mini-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        margin-top: 12px;
        padding: 0 18px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: var(--brown);
        color: #fff;
        font-size: 13px;
        font-weight: 850;
      }

      .mini-cta.outline {
        border-color: #cfbd71;
        background: transparent;
        color: #9b7411;
      }

      .bottom-nav {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0;
        padding: 11px 12px 20px;
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.95);
      }

      .nav-item {
        display: grid;
        place-items: center;
        gap: 4px;
        color: #777a7d;
        font-size: 11px;
        line-height: 1;
      }

      .nav-item.active {
        color: #000;
        font-weight: 850;
      }

      .nav-item.active::before {
        content: "";
        position: absolute;
        bottom: 82px;
        width: 62px;
        height: 4px;
        border-radius: 999px;
        background: #000;
      }

      .code-note {
        max-width: 1440px;
        margin: 34px auto 0;
        padding: 18px 20px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.68);
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .state-board {
        max-width: 1440px;
        margin: 28px auto 0;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.68);
      }

      .state-board h2 {
        margin: 0 0 14px;
        font-size: 22px;
        letter-spacing: -0.03em;
      }

      .state-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(210px, 1fr));
        gap: 12px;
      }

      @media (max-width: 1440px) {
        .canvas {
          grid-template-columns: repeat(2, minmax(315px, 1fr));
        }

        .canvas.three-up {
          grid-template-columns: repeat(2, minmax(315px, 1fr));
        }

        .state-grid {
          grid-template-columns: repeat(2, minmax(240px, 1fr));
        }
      }

      @media (max-width: 760px) {
        .page {
          padding: 24px 14px 42px;
        }

        .canvas {
          grid-template-columns: 1fr;

        .interactive-preview {
          grid-template-columns: 1fr;
        }

        }

        }

        .phone {

        return `

            <div class="banner-top">
              <span class="tag ${s.tagClass}">${state === "complete" ? icon("check", 13) : ""}${s.tag}</span>

                <h3 class="module-title">Recommendations pending</h3>
                <p class="module-copy">Your recommendations will appear after LifeForce completes clinical review of your bloodwork and LifeForce Health Profile.</p>
                <div class="chip-row" style="justify-content:center"><span class="chip">Bloodwork needed</span><span class="chip">Profile needed</span><span class="chip">Review pending</span></div>
                <button class="cta">Book Blood Draw</button>
                <button class="cta ghost">Browse Products While You Wait</button>
              </div>
            </section>
          `,
        );
      }

      function renderControls() {
        document.getElementById("stateControls").innerHTML = previewControls
          .map(
            (group) => `
              <div class="control-group" data-control-group="${group.id}">
                <div class="control-label">${group.label}</div>
                <div class="segmented">
                  ${group.options
                    .map(
                      ([value, label]) => `
                        <button type="button" data-control="${group.id}" data-value="${value}" aria-pressed="${previewState[group.id] === value}">
                          ${label}
                        </button>
                      `,
                    )
                    .join("")}
                </div>
              </div>
            `,
          )
          .join("");
      }

      function derivePreviewVariant() {
        const base = variants.find((variant) => variant.key === previewState.userType) || variants[0];
        const member = previewState.userType.startsWith("member");
        const priorLabs = previewState.userType.includes("prior_labs");
        const status = previewState.resultsStatus;
        const earlyNoLabs = previewState.userType === "non_member_no_labs" && status === "no_labs";
        const hasLabs = ["labs_reviewed", "recommendations_ready", "recommendations_locked"].includes(status) || (priorLabs && status !== "no_labs");
        const recommendationsReady = status === "recommendations_ready";
        const locked = status === "recommendations_locked";
        const waiting = ["labs_booked", "labs_processing", "labs_reviewed"].includes(status);
        const waitingProductCopy =
          status === "labs_reviewed"
            ? "Explore products available through ULC. Personalized recommendations appear once LifeForce completes clinical recommendation review."
            : "Explore supplements and wellness products available through ULC. Personalized recommendations unlock after your bloodwork is reviewed.";

        const stateCopy = {
          no_labs: member
            ? ["Book your first blood draw", "Your LifeForce plan begins with comprehensive bloodwork and clinical review.", "Book Blood Draw", "syringe"]
            : ["First step: Health Profile", "Answer a few questions before your first blood draw.", "Start Health Profile", "clipboard-list"],
          labs_booked: ["Labs booked", "Your blood draw is scheduled. Complete your LifeForce Health Profile so your review is ready.", "View Appointment", "calendar-check"],
          labs_processing: ["Bloodwork processing", "Your results are being processed. Personalized recommendations unlock after clinical review.", "View Lab Status", "loader"],
          labs_reviewed: ["Review your results", "Your LifeForce blood panel is ready. Recommendations may require clinical review before they unlock.", "View Reports", "file-text"],
          recommendations_ready: ["Review your plan", "Your clinician-reviewed recommendations are ready based on your latest bloodwork and LifeForce Health Profile.", "View Recommendations", "sparkles"],
          recommendations_locked: member
            ? ["Recommendations pending", "Your recommendations will appear after LifeForce completes clinical review.", "Check Review Status", "lock"]
            : ["Unlock recommendations", "Join LifeForce to unlock clinician-reviewed recommendations from your lab results.", "Explore Membership", "lock"],
        };

        const [actionTitle, actionCopy, cta, ctaIcon] = stateCopy[status];
        return {
          ...base,
          label: "Live · Prototype preview",
          livePreview: true,
          userType: previewState.userType,
          member,
          priorLabs: false,
          memberPriorLabs: false,
          poweredChip: member,
          profileState: previewState.profileStatus,
          hasLabs,
          resultsStatus: status,
          actionTitle,
          actionCopy,
          cta,
          ctaIcon,
          noLabsCta: member ? "Book Blood Draw" : "Start Your Plan",
          title: "Your Longevity Journey",
          subtitle: "Powered by LifeForce",
          context: base.context || "LifeForce uses your profile and lab results to guide clinician-reviewed recommendations.",
          introTitle: base.introTitle,
          compactContext: earlyNoLabs ? false : true,
          productTitle: earlyNoLabs ? base.productTitle : recommendationsReady ? "Your Product Recommendations" : waiting ? "Browse Products While You Wait" : "Browse Products",
          productCopy: recommendationsReady
            ? "Based on your latest bloodwork, LifeForce Health Profile, and clinician review."
            : earlyNoLabs
              ? base.productCopy
              : waitingProductCopy,
          locked,
        };
      }

      function renderInteractivePreview() {
        renderControls();
        document.getElementById("livePreview").innerHTML = renderVariant(derivePreviewVariant());
        hydrateIcons();
      }

      function setViewMode(mode) {
        const showAll = mode === "all";
        document.getElementById("interactiveView").hidden = showAll;
        document.getElementById("allScreensView").hidden = !showAll;
        document.querySelectorAll("[data-view]").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.view === mode));
        });
        hydrateIcons();
      }

      function hydrateIcons() {
        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons({ strokeWidth: 2 });
        }
      }

      function renderPrototype() {
        renderInteractivePreview();
        document.getElementById("canvas").innerHTML = variants.map(renderVariant).join("");
        document.getElementById("labsFlow").innerHTML = [
          labReportsListing(),
          labReportsEmpty(),
          labReportDetail(),
          biomarkerDetail(),
          processingState(),
        ].join("");
        document.getElementById("productFlow").innerHTML = [
          recommendationsPage(),
          recommendationsLocked(),
          productBrowsePage(),
          productDetailPage(),
        ].join("");
        document.getElementById("profileStates").innerHTML = Object.keys(profileStates)
          .map((state) => profileBanner(state))
          .join("");
        document.getElementById("stateControls").addEventListener("click", (event) => {
          const button = event.target.closest("[data-control]");
          if (!button) return;
          previewState[button.dataset.control] = button.dataset.value;
          renderInteractivePreview();
        });

        document.getElementById("viewToggle").addEventListener("click", (event) => {
          const button = event.target.closest("[data-view]");
          if (!button) return;
          setViewMode(button.dataset.view);
        });
        setViewMode("all");
        hydrateIcons();
      }

      renderPrototype();
    </script>
  </body>
</html>
